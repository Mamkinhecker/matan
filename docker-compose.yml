services:
  postgres:
    image: postgres:16-alpine
    container_name: matan-trainer-postgres
    environment:
      POSTGRES_DB: matan_trainer
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data:
