{{define "content"}}
<div class="page-head">
	<p class="eyebrow">Demo student</p>
	<h1>Прогресс</h1>
	<p>Пока все попытки пишутся в один общий профиль без авторизации.</p>
</div>
<section class="table-wrap">
	<table>
		<thead><tr><th>Режим</th><th>Оценка</th><th>Попыток</th><th>Последняя</th></tr></thead>
		<tbody>
			{{range .Progress}}
			<tr><td>{{.Mode}}</td><td>{{.Grade}}</td><td>{{.Attempts}}</td><td>{{.LastAttemptAt}}</td></tr>
			{{else}}
			<tr><td colspan="4">Пока нет попыток.</td></tr>
			{{end}}
		</tbody>
	</table>
</section>
{{end}}
{{template "layout" .}}
