{{define "layout"}}
<!doctype html>
<html lang="ru">
<head>
	<meta charset="utf-8">
	<meta name="viewport" content="width=device-width, initial-scale=1">
	<title>{{.Title}}</title>
	<link rel="stylesheet" href="/static/styles.css">
</head>
<body>
	<header class="topbar">
		<a class="brand" href="/">Matan Trainer</a>
		<nav class="nav">
			<a class="{{if eq .Active "topics"}}active{{end}}" href="/topics">Темы</a>
			<a class="{{if eq .Active "cards"}}active{{end}}" href="/cards">Карточки</a>
			<a class="{{if eq .Active "formulations"}}active{{end}}" href="/formulations">Формулировки</a>
			<a class="{{if eq .Active "proof-game"}}active{{end}}" href="/proof-game">Доказательства</a>
			<a class="{{if eq .Active "oral"}}active{{end}}" href="/oral">Устный</a>
			<a class="{{if eq .Active "variant"}}active{{end}}" href="/variant">Вариант</a>
			<a class="{{if eq .Active "progress"}}active{{end}}" href="/progress">Прогресс</a>
		</nav>
	</header>
	<main class="shell">
		{{template "content" .}}
	</main>
	<script src="/static/app.js"></script>
</body>
</html>
{{end}}
